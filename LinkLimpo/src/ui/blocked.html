<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkLimpo</title>
    <link rel="icon" href="../../icons/on-32.png" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
      .card { max-width: 560px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--strip);
        border-radius: 10px; padding: 28px; display: grid; gap: 14px; }
      h1 { font-size: 22px; font-weight: 750; letter-spacing: -.01em; }
      .target { background: var(--paper); border-radius: 6px; padding: 10px 12px; }
      .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="../../icons/on-48.png" alt="" width="36" height="36" />
      <h1 data-i18n="blockedTitle"></h1>
      <p class="muted" id="why"></p>
      <div class="target url" id="target"></div>
      <div class="row">
        <button class="btn primary" id="back" data-i18n="blockedBack"></button>
        <button class="btn" id="proceed" data-i18n="blockedProceed"></button>
      </div>
      <p class="muted" style="font-size: 12.5px" data-i18n="blockedHint"></p>
    </main>
    <script src="common.js"></script>
    <script src="blocked.js"></script>
  </body>
</html>
